
services:
  mysql-db:
    image: mysql:8
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: products_ms_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - db-network
      - shared-network          # allow microservices to connect to the DB

  sonar-db:
    image: postgres:15
    container_name: sonarqube_db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - sonar-network
      - shared-network          # allow SonarQube to access the DB
  
  sonarqube:
    image: sonarqube:lts
    container_name: sonarqube
    depends_on:
      - sonar-db
    environment:
      # point to the postgres service name (sonar-db)
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped
    networks:
      - sonar-network
      - shared-network

  products-ms:
    build:
      context: ./products-ms
      dockerfile: DockerFile
    container_name: products-ms
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/products_ms_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
    ports:
      - "9090:9090"
    depends_on:
      - mysql-db
      - logstash
    networks:
      - ms-network
      - shared-network          # allow microservices to access the DB

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - elk-network
      - shared-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: logstash
    volumes:
      - ./elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "5044:5044"   # Beats input or log shipping
    depends_on:
      - elasticsearch
    networks:
      - elk-network
      - shared-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - elk-network
      - shared-network

networks:
  db-network:
  ms-network:
  elk-network:
  shared-network:
  sonar-network:

volumes:
  mysql_data:
  elastic_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql:
  postgresql_data:
  