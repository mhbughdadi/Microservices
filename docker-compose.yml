
services:
  mysql-db:
    image: mysql:8
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: products_ms_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - db-network
      - shared-network          # allow microservices to connect to the DB
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  sonar-db:
    image: postgres:15
    container_name: sonarqube_db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - sonar-network
      - shared-network          # allow SonarQube to access the DB
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  sonarqube:
    image: sonarqube:lts
    container_name: sonarqube
    depends_on:
      - sonar-db
    environment:
      # point to the postgres service name (sonar-db)
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped
    networks:
      - sonar-network
      - shared-network

  products-ms:
    build:
      context: ./products-ms
      dockerfile: DockerFile

      args:
        NEXUS_URL: http://host.docker.internal:8081/repository/maven-public/
        NEXUS_USERNAME: admin
        NEXUS_PASSWORD: Nexus@2026

    container_name: products-ms

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/products_ms_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
    
    ports:
      - "9090:9090"
    depends_on:
      mysql-db:
        condition: service_healthy
      logstash:
        condition: service_healthy
      nexus:
        condition: service_healthy
    networks:
      - ms-network
      - db-network              # allow microservices to access the DB
      - shared-network          

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - elk-network
      - shared-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://localhost:9200/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.0
    container_name: logstash
    volumes:
      - ./elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "5044:5044"   # Beats input or log shipping
    depends_on:
      - elasticsearch
    networks:
      - elk-network
      - shared-network
    # Logstash does not expose a single robust HTTP readiness probe by default;
    # we add a lightweight check that the pipeline file is present to reduce
    # race conditions where the container starts but file mounts are not ready.
    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/share/logstash/pipeline/logstash.conf || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - elk-network
      - shared-network
  
  nexus:
    image: sonatype/nexus3
    container_name: nexus
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - nexus-data:/nexus-data
    environment:
      INSTALL4J_ADD_VM_PARAMS: >
        -Xms1g
        -Xmx1g
        -XX:MaxDirectMemorySize=2g
    networks:
      - shared-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
  
  pricing-db:
    image: postgres:16
    container_name: pricing-db
    environment:
      POSTGRES_USER: pricing_user
      POSTGRES_PASSWORD: pricing_password
      POSTGRES_DB: pricing_db
    ports:
      - "5432:5432"
    volumes:
      - pricing-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - pricing-network 
      - shared-network        
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pricing_user"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
  
  pricing-ms:
    build:
      context: ./pricing-ms
      dockerfile: DockerFile

      args:
        NEXUS_URL: http://host.docker.internal:8081/repository/maven-public/
        NEXUS_USERNAME: admin
        NEXUS_PASSWORD: Nexus@2026

    container_name: pricing-ms

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://pricing-db:5432/pricing_db
      SPRING_DATASOURCE_USERNAME: pricing_user
      SPRING_DATASOURCE_PASSWORD: pricing_password
    
    ports:
      - "9092:9092"
    depends_on:
      pricing-db:
        condition: service_healthy
      logstash:
        condition: service_healthy
      nexus:
        condition: service_healthy
    networks:
      - ms-network
      - pricing-network              # allow microservices to access the DB
      - shared-network          

networks:
  db-network:
  ms-network:
  elk-network:
  pricing-network:
  shared-network:
  sonar-network:

volumes:
  mysql_data:
  elastic_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql:
  postgresql_data:
  nexus-data:
  pricing-db-data:
  