
services:
  mysql-db:
    image: mysql:8
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: products_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - db-network
      - shared-network          # allow microservices to connect to the DB

  products-ms:
    build:
      context: ./products-ms
    container_name: products-ms
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/products_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
    ports:
      - "9090:9090"
    depends_on:
      - mysql-db
    networks:
      - ms-network
      - shared-network          # allow microservices to access the DB

networks:
  db-network:
  ms-network:
  shared-network:

volumes:
  mysql_data:
